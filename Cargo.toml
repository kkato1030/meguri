[package]
name = "meguri"
version = "2.0.0-dev"
edition = "2024"
description = "Run AI coding agents on a loop inside a terminal multiplexer, so humans can step in anytime."
license = "MIT"
repository = "https://github.com/kkato1030/meguri"
readme = "README.md"
keywords = ["ai", "agents", "tmux", "automation", "github"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.89"

# v2 の依存方針: 「全行を理解できるコードベース」を守るため、増分ごとに
# 依存を最小に保つ。新しい crate は、それが解く問題が実際に現れたときに足す。
[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "meguri"
path = "src/main.rs"
